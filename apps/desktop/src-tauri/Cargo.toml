[package]
name = "ttime"
version = "0.2.0"
description = "Local-first macOS time tracker"
edition = "2024"
publish = false

# `specta` is only referenced by tauri-specta's `collect_commands!` expansion, which machete
# cannot see. See docs/DECISIONS.md.
[package.metadata.cargo-machete]
ignored = ["specta"]

[lib]
name = "ttime_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
log = "0.4.35"
notify-debouncer-full = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.26", features = ["derive", "function"] }
specta-typescript = "=0.0.13"
tauri = { version = "2.12.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-log = "2.10.1"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2.0.21"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
tauri-nspanel = "2.1.1"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[dev-dependencies]
tempfile = "3.27.0"

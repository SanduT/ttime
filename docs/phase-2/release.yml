# Phase 2 reference workflow. NOT ACTIVE.
#
# To enable: copy this file to .github/workflows/release.yml, add the secrets below,
# and check action versions and inputs against the tauri-action README.
# See docs/ARCHITECTURE.md section 14.
#
# Required repository secrets:
#   APPLE_CERTIFICATE                    Developer ID Application certificate and key (.p12), base64
#   APPLE_CERTIFICATE_PASSWORD           password of the .p12
#   APPLE_SIGNING_IDENTITY               e.g. "Developer ID Application: Your Name (TEAMID)"
#   KEYCHAIN_PASSWORD                    any random string, used for the temporary CI keychain
#   APPLE_API_ISSUER                     App Store Connect issuer ID
#   APPLE_API_KEY                        App Store Connect API key ID
#   APPLE_API_KEY_P8_BASE64              App Store Connect API key file (.p8), base64
#   TAURI_SIGNING_PRIVATE_KEY            updater signing key (from `bunx tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password
#
# Release: git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: |
          bun test
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Compile CLI sidecar
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p apps/desktop/src-tauri/binaries
          bun build --compile packages/cli/src/index.ts --outfile "apps/desktop/src-tauri/binaries/ttime-$TRIPLE"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          args: --target aarch64-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: 'ttime ${{ github.ref_name }}'
          releaseBody: 'Download the .dmg below and drag ttime to Applications.'
          releaseDraft: true
          prerelease: false

      # Later: verify the DMG with `spctl` and `stapler validate`, then update the Homebrew tap cask.

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

# A `v*` tag builds, signs and notarizes ttime.app and drafts a GitHub Release with the DMG.
# Secrets: docs/ARCHITECTURE.md section 14.2. Release: bump the version, tag vX.Y.Z, push the tag,
# then publish the draft.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag matches the app version
        run: |
          version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' apps/desktop/src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install the Rust toolchain from rust-toolchain.toml
        working-directory: apps/desktop/src-tauri
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: |
          bun run test
          bun run test:rust

      - name: Compile the CLI sidecar
        run: bun run build:sidecar

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and draft the release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          args: --config src-tauri/tauri.bundle.conf.json --bundles app,dmg
          tagName: ${{ github.ref_name }}
          releaseName: ttime ${{ github.ref_name }}
          releaseBody: Download the .dmg below, open it and drag ttime to Applications. Changes are in CHANGELOG.md.
          releaseDraft: true
          prerelease: false

      - name: Gatekeeper accepts the app
        run: |
          app=apps/desktop/src-tauri/target/release/bundle/macos/ttime.app
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
